/* (3 Nov, Ngoc: "design lại từ đầu", mockup 2 approved) the Dashboard answers three questions: which learner needs me?

   The page reads the Sheet through the Apps Script with the account's ticket. */

  --ok-soft: #1d3326; --bad-soft: #3b1a17; --once-soft: #3a3214; } }
:root[data-theme="dark"] { --ok: #7fd49a; --help: #4f8f66; --help-ink: #eafff0; --bad: #ff8a80; --warn: #f3c969; --warn-bg: #3b1a17; --warn-ink: #ffb4ab; --ok-soft: #1d3326; --bad-soft: #3b1a17; --once-soft: #3a3214; }

const ACC_KEY = "tracer-account-v1", PROGRESS_LS = "tracer-progress-v1", GUEST_KEY = "tracer-guest";
let account = null;
try { account = JSON.parse(localStorage.getItem(ACC_KEY) || "null"); } catch (e) {}
function storeAccount() { try { account ? localStorage.setItem(ACC_KEY, JSON.stringify(account)) : localStorage.removeItem(ACC_KEY); } catch (e) {} }
const accEsc = t => String(t == null ? "" : t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "\'": "&#39;" }[c]));
// the address of the Apps Script: the Exercises page has its own SHEET_URL; the other pages get SITE_SHEET_URL (build)
function sheetUrl() { try { if (typeof SHEET_URL === "string" && SHEET_URL) return SHEET_URL; } catch (e) {} return SITE_SHEET_URL; }
const SHEET_ON = () => sheetUrl().startsWith("https://");
// ---------------------------------------------------------------- talking to the Apps Script
// A plain POST (no extra headers: a "simple request"); the Apps Script answers JSON.  "busy" (another request holds the
// lock) → try again a little later.
async function api(action, data, tries = 4) {
  if (!SHEET_ON()) throw new Error("offline");
  const body = JSON.stringify({ action, ...(data || {}), auth: account ? { username: account.username, ticket: account.ticket } : null });
  for (let i = 0; ; i++) {
    let r;
    try { const res = await fetch(sheetUrl(), { method: "POST", body }); r = await res.json(); }
    catch (e) { if (i + 1 >= tries) throw e; r = { error: "busy" }; }
    if (r.error !== "busy" || i + 1 >= tries) return r;
    await new Promise(ok => setTimeout(ok, 1500 * (i + 1) + Math.random() * 1000));
  }
}

// ---------------------------------------------------------------- the password: PBKDF2 in the browser (Web Crypto)
const ROUNDS = 600000;
function randomHex(bytes) { return [...crypto.getRandomValues(new Uint8Array(bytes))].map(b => b.toString(16).padStart(2, "0")).join(""); }
async function passKey(password, saltHex) {
  const salt = new Uint8Array(saltHex.match(/../g).map(h => parseInt(h, 16)));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt, iterations: ROUNDS }, base, 256);
  return [...new Uint8Array(bits)].map(b => b.toString(16).padStart(2, "0")).join("");
}

function passwordProblem(pw, again) {
  if (/[^\x20-\x7e]/.test(pw)) return "No Vietnamese accents in the password (â, ă, đ, ê, ô, ơ, ư…). Turn off Vietnamese typing (Unikey) and type it again.";
  if (pw.length < 8) return "At least 8 characters.";
  if (COMMON_PW.has(pw.toLowerCase())) return "This password is too common. Choose another one.";
  if (again != null && pw !== again) return "The two passwords are not the same.";
  return "";
}
const USERNAME_OK = /^[a-z0-9._]{3,20}$/;
function usernameProblem(u) { return USERNAME_OK.test(u) ? "" : "Username: 3–20 letters a–z, numbers, . or _ (no accents, no spaces)."; }
const accCrypto = typeof crypto !== "undefined" && crypto.subtle;

// ---------------------------------------------------------------- cards (Exercises page) and the boxes of every form
function accCard(html) {
  document.querySelectorAll(".lay-start").forEach(x => x.remove());
  const box = document.createElement("div"); box.className = "lay-start";
  box.innerHTML = `<div class="lay-card acc-card">${html}</div>`;
  document.body.append(box);
  addEyes(box); addPwRules(box);
  const f = box.querySelector("input"); if (f) f.focus();
  return box;
}
// (2 Nov, Ngoc) the password rules as a list under the boxes, checked while typing: green ✓ when met, red ✗ when not
// (Sign up and New password; the same rules as passwordProblem, which still checks on Sign up)
function addPwRules(box) {
  const p = box.querySelector("#acc-p"), p2 = box.querySelector("#acc-p2");
  if (!p || !p2) return;
  const ul = document.createElement("ul"); ul.className = "acc-rules"; ul.setAttribute("aria-live", "polite");
  const rules = [["At least 8 characters", a => a.length >= 8],
    ["No Vietnamese accents (â, ă, đ, ê, ô, ơ, ư…)", a => !!a && !/[^\x20-\x7e]/.test(a)],
    ["Not a common password (like 12345678)", a => a.length >= 8 && !COMMON_PW.has(a.toLowerCase())],
    ["The two passwords are the same", (a, b) => !!a && a === b]];
  // (3 Nov, Ngoc: "tùm lum") the list shows once a password box is used; the advice is its last line (was a line of its own)
  const tip = "Not a password you use somewhere else";
  // (2 Nov, Ngoc: "nothing is wrong yet, why ✗?") before the first try: a rule met is green ✓, one not met yet is grey •;
  // after Sign up / Set the new password was pressed, a rule not met is red ✗
  let tried = false;
  const draw = () => { ul.innerHTML = rules.map(([t, ok]) => { const y = ok(p.value, p2.value), k = y ? "ok" : tried ? "no" : "todo";
    return `<li class="${k}"><span aria-hidden="true">${{ ok: "✓", no: "✗", todo: "•" }[k]}</span> ${accEsc(t)}<span class="sr">${y ? " (done)" : " (not yet)"}</span></li>`; }).join("")
    + `<li class="todo"><span aria-hidden="true">•</span> ${accEsc(tip)}</li>`; };
  p2.closest("label").after(ul);
  ul.hidden = true; const open = () => { ul.hidden = false; };
  [p, p2].forEach(x => { x.addEventListener("input", draw); x.addEventListener("focus", open); });
  const f = p.closest("form"); if (f) f.addEventListener("submit", () => { tried = true; open(); draw(); });
  draw();
}
// (2 Nov, Ngoc) a "Show" button on every password box, to see what was typed (hidden again by a second click);
// hidden by default (a computer in a classroom: the neighbours see the screen)
function addEyes(box) {
  box.querySelectorAll('input[type="password"]').forEach(inp => {
    const wrap = document.createElement("span"); wrap.className = "acc-pw";
    inp.replaceWith(wrap); wrap.append(inp);
    const b = document.createElement("button"); b.type = "button"; b.className = "acc-eye"; b.textContent = "Show";
    b.setAttribute("aria-label", "Show the password"); b.setAttribute("aria-pressed", "false");
    b.onclick = () => { const show = inp.type === "password"; inp.type = show ? "text" : "password";
      b.textContent = show ? "Hide" : "Show"; b.setAttribute("aria-pressed", String(show));
      b.setAttribute("aria-label", show ? "Hide the password" : "Show the password"); inp.focus(); };
    wrap.append(b);
  });
}
const accVal = (box, id) => (box.querySelector("#" + id) || {}).value || "";
function accSay(box, text) { const e = box.querySelector(".acc-msg"); if (e) { e.textContent = text; e.hidden = !text; } }
function accBusy(box, on, text) { box.querySelectorAll("button").forEach(b => b.disabled = on); if (on) accSay(box, text || "Please wait…"); }
function recoveryCard(code, title, then) {
  const box = accCard(`<h2>${accEsc(title)}</h2><p>Your recovery code:</p><p class="acc-code">${accEsc(code)}</p>`
    + `<p>Write it down. If you forget your password, this code lets you choose a new one. It is shown only now.</p>`
    + `<button type="button" id="acc-ok">I wrote it down</button>`);
  box.querySelector("#acc-ok").onclick = () => { box.remove(); then && then(); };
}

// ---------------------------------------------------------------- preferences (Settings), kept in this browser
// Theme: system / light / dark (every page reads data-theme on <html>); text size: normal / large; language: English
// (Tiếng Việt: coming soon — 2 Nov, Ngoc: the button first, the translation later)
const pref = (k, d) => { try { return localStorage.getItem(k) || d; } catch (e) { return d; } };
const setPref = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
function applyPrefs() {
  const t = pref("tracer-theme", "system"), r = document.documentElement;
  if (t === "system") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", t);
  r.setAttribute("data-size", pref("tracer-size", "normal"));
}
applyPrefs();

// (16 Nov) the language: kept in this browser; changed at once on the Exercises page (next_i18n.js i18nSet)
function setLang(l) {
  if (l === pref("tracer-lang", "en")) return;
  setPref("tracer-lang", l);
  if (typeof i18nSet === "function") { i18nSet(l); hdrDraw(); return; }       // the Exercises page: at once, nothing reloaded
  const u = new URL(location.href); u.searchParams.delete("lang"); location.href = u.toString();
}
function hdrCloseMenus(except) {
  document.querySelectorAll(".hdr-dd").forEach(d => { if (d === except) return; const m = d.querySelector(".hdr-menu"), b = d.querySelector("[data-dd]");
    if (m) m.hidden = true; if (b) b.setAttribute("aria-expanded", "false"); });
}
document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-dd]");
  if (t) { const d = t.closest(".hdr-dd"), m = d.querySelector(".hdr-menu"); hdrCloseMenus(d); m.hidden = !m.hidden; t.setAttribute("aria-expanded", String(!m.hidden)); return; }
  const lg = ev.target.closest("[data-lang]");
  if (lg && (lg.closest(".hdr-menu") || lg.closest(".hdr-langdd"))) { hdrCloseMenus(); if (!lg.disabled) setLang(lg.dataset.lang); return; }
  const a = ev.target.closest("[data-act]");
  if (a && a.closest(".hdr-menu")) { hdrCloseMenus(); ({ settings: settingsDialog, join: joinDialog, logout: hdrLogout })[a.dataset.act](); return; }
  if (!ev.target.closest(".hdr-menu")) hdrCloseMenus();
});
document.addEventListener("keydown", ev => { if (ev.key === "Escape") { hdrCloseMenus(); document.querySelectorAll(".hdr-dlg").forEach(x => x.remove()); } });
// Log out: the Exercises page also forgets the progress kept on this computer (it is on the Sheet), then Sign in
function hdrLogout() {
  if (typeof logOut === "function") return logOut();
  if (account) api("logout", {}).catch(() => {});
  account = null; storeAccount();
  try { const p = JSON.parse(localStorage.getItem(PROGRESS_LS) || "null"); if (p && p.user) localStorage.removeItem(PROGRESS_LS); } catch (e) {}
  location.href = "signin.html";
}
// a small window over the page (Settings, Join a class)
function hdrDialog(title, html) {
  document.querySelectorAll(".hdr-dlg").forEach(x => x.remove());
  const box = document.createElement("div"); box.className = "hdr-dlg lay-start";
  box.innerHTML = `<div class="lay-card acc-card" role="dialog" aria-modal="true" aria-label="${accEsc(title)}"><div class="hdr-dlgtop"><h2>${accEsc(title)}</h2><button type="button" class="hdr-x" aria-label="Close">✕</button></div>${html}</div>`;
  document.body.append(box); addEyes(box);
  box.querySelector(".hdr-x").onclick = () => box.remove();
  box.addEventListener("click", e => { if (e.target === box) box.remove(); });
  const f = box.querySelector("input, button:not(.hdr-x)"); if (f) f.focus();
  return box;
}
function settingsDialog() {
  const radios = (name, cur, opts) => opts.map(([v, t, dis]) => `<label class="acc-check"><input type="radio" name="${name}" value="${v}"${v === cur ? " checked" : ""}${dis ? " disabled" : ""}> ${t}</label>`).join("");
  const box = hdrDialog("Settings", `<div class="hdr-set"><h3>Theme</h3>${radios("theme", pref("tracer-theme", "system"), [["system", "Same as my computer"], ["light", "Light"], ["dark", "Dark"]])}
    <h3>Text size</h3>${radios("size", pref("tracer-size", "normal"), [["normal", "Normal"], ["large", "Large"]])}
    <h3>Language</h3>${typeof I18N_ON !== "undefined" ? radios("lang", pref("tracer-lang", "en"), [["en", "English"], ["vi", "Tiếng Việt"]])
      : radios("lang", "en", [["en", "English"], ["vi", "Tiếng Việt <span class=\"hdr-soon\">coming soon</span>", true]])}
    ${account ? `<h3>Account</h3><div class="acc-row"><button type="button" class="ghost" id="set-rec">New recovery code</button><button type="button" class="ghost" id="set-del">Delete my account</button></div>` : ""}
    <p class="acc-msg" hidden></p></div>`);
  box.querySelectorAll('input[name="theme"]').forEach(r => r.onchange = () => { setPref("tracer-theme", r.value); applyPrefs(); });
  box.querySelectorAll('input[name="size"]').forEach(r => r.onchange = () => { setPref("tracer-size", r.value); applyPrefs(); });
  box.querySelectorAll('input[name="lang"]').forEach(r => r.onchange = () => setLang(r.value));
  if (!account) return;
  const askPw = (title, go) => {
    const b2 = hdrDialog(title, `<form class="acc-form"><label>Your password<input id="acc-p" type="password" autocomplete="current-password"></label>
      <button type="submit">Continue</button><p class="acc-msg" hidden></p></form>`);
    b2.querySelector("form").addEventListener("submit", async e => {
      e.preventDefault(); accBusy(b2, true);
      try { const s = await api("salt", { username: account.username }); await go(b2, await passKey(accVal(b2, "acc-p"), s.salt)); }
      catch (err) { accBusy(b2, false); accSay(b2, "Could not reach the server (internet?)."); }
    });
  };
  box.querySelector("#set-rec").onclick = () => askPw("New recovery code", async (b2, key) => {
    const r = await api("newRecovery", { key }); accBusy(b2, false);
    if (!r.ok) return accSay(b2, "Wrong password.");
    b2.remove(); recoveryCard(r.recovery, "Your new recovery code", null);
  });
  box.querySelector("#set-del").onclick = () => askPw("Delete my account", async (b2, key) => {
    accBusy(b2, false);
    if (!b2.dataset.sure) { b2.dataset.sure = "1"; accSay(b2, "Your account and your progress will be deleted. Click Continue again to delete."); return; }
    accBusy(b2, true);
    const r = await api("deleteAccount", { key }); accBusy(b2, false);
    if (!r.ok) return accSay(b2, "Wrong password.");
    account = null; storeAccount(); try { localStorage.removeItem(PROGRESS_LS); } catch (e) {}
    location.href = "signin.html?deleted=1";
  });
}
function joinDialog() {
  const box = hdrDialog(account.cls ? "Change class" : "Join a class", `<form class="acc-form"><label>Class code <span class="muted">(from your teacher)</span>
    <input id="acc-c" value="${accEsc(account.cls || "")}" autocapitalize="characters" spellcheck="false" placeholder="K7QM-28"></label>
    <button type="submit">Save</button><p class="acc-msg" hidden></p>${account.cls ? `<p class="acc-small"><button type="button" class="acc-link" id="acc-leave">Leave the class</button></p>` : ""}</form>`);
  const go = async cls => {
    accBusy(box, true);
    try {
      const r = await api("joinClass", { cls }); accBusy(box, false);
      if (r.ok) { account = { ...account, ...r.account }; storeAccount(); hdrDraw(); box.remove(); return; }
      accSay(box, r.error === "closed" ? "This class is closed: ask your teacher." : r.error === "class" ? "There is no class with this code. Check it." : "Could not save. Log in again?");
    } catch (err) { accBusy(box, false); accSay(box, "Could not reach the server (internet?)."); }
  };
  box.querySelector("form").addEventListener("submit", e => { e.preventDefault(); const c = accVal(box, "acc-c").trim(); if (!c) return accSay(box, "Type the code your teacher gave you."); go(c); });
  const lv = box.querySelector("#acc-leave"); if (lv) lv.onclick = () => go("");
}

html[data-size="large"] body { zoom: 1.15; }`;

<div class="wrap">
  <div class="head"><h1>Dashboard</h1><span class="fresh" id="fresh"></span><span id="pick"></span><span id="newbtn"></span></div>
  <p id="testmode" class="testmode" hidden>Test mode: everyone can see everyone.</p>
  <nav class="dtabs" id="dtabs" aria-label="Dashboard parts"><a href="#overview" data-tab="overview">Overview</a><a href="#learners" data-tab="learners">Learners</a><a href="#mistakes" data-tab="mistakes">Mistakes</a><a href="#app" data-tab="app">How the app did</a></nav>
  <div id="main"><p class="muted">Loading…</p></div>
</div>
<script>
const SHEET_URL = "https://odqbjeltsathqimokmhh.supabase.co/functions/v1/api";
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? "" : t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// (2 Nov) everything shown here was written by learners' browsers: no new script may run on this page (the page's own
// code uses no inline handlers); every value from a summary is escaped or made a number
(() => { const m = document.createElement("meta"); m.httpEquiv = "Content-Security-Policy";
  m.content = "script-src 'none'; object-src 'none'; base-uri 'none'"; document.head.append(m); })();
const DAY = 864e5;   // (3 Nov, Ngoc) no "inactive" any more: finished learners and a weekly class were flagged
const TABS = ["overview", "learners", "mistakes", "app"];   // (5 Nov night, Ngoc) "app": How the app did, for the thesis
let state = { cls: "", names: "auto", data: null, at: 0, filter: "", tab: (location.hash.replace("#", "") || "overview") };
if (!TABS.includes(state.tab)) state.tab = "overview";
addEventListener("hashchange", () => { const t = location.hash.replace("#", ""); if (TABS.includes(t)) { state.tab = t; if (state.data) draw(); if (!backTo()) window.scrollTo({ top: 0 }); } });
// (4 Nov, chat 9, Ngoc: "ấn x thì nó ở tab learner luôn") ✕ on "Showing: …": back to the tab where "Who?" was clicked, at that mistake
function backTo() {
  const k = state.back; state.back = null; if (!k) return false;
  const d = [...document.querySelectorAll("details.mi[data-key]")].find(x => x.dataset.key === k);
  const b = d || ([...document.querySelectorAll("[data-filter]")].find(x => x.dataset.filter === k) || {}).parentElement;
  if (!b) return false;
  if (d) d.open = true;
  b.scrollIntoView({ block: "center" }); return true;
}
try { const n = localStorage.getItem("dash-names"); state.names = n === null ? "auto" : n === "1"; state.cls = localStorage.getItem("dash-cls") || ""; } catch (e) {}

async function load() {
  if (!account) { $("main").innerHTML = forTeachers(true); return; }
  const ck = "dash-last:" + account.username + ":" + state.cls;
  try { const old = JSON.parse(sessionStorage.getItem(ck) || "null"); if (old && !state.data) { state.data = old.r; state.at = old.at; draw(); } } catch (e) {}
  $("fresh").innerHTML = `Updating…`;
  let r;
  try { r = await api("dashboard", { cls: state.cls }); }
  catch (e) { freshLine("Could not reach the server (internet?)"); if (!state.data) $("main").innerHTML = `<div class="card"><p>Could not reach the server (internet?).</p></div>`; return; }
  if (r.error === "auth") { $("main").innerHTML = `<div class="card"><p>Please <a href="signin.html?next=dashboard.html">sign in</a> again.</p></div>`; return; }
  if (!r.ok) { $("main").innerHTML = `<div class="card"><p>Something went wrong (${esc(r.error)}).</p></div>`; return; }
  state.data = r; state.at = Date.now(); draw();
  // (3 Nov, Ngoc: B) a learner opened it: only what the page is (test mode: the card on top of what everyone can see)
  if (r.role !== "teacher") { if (r.testMode || r.admin) $("main").insertAdjacentHTML("afterbegin", forTeachers(false)); else $("main").innerHTML = forTeachers(false); }
  try { sessionStorage.setItem(ck, JSON.stringify({ r, at: state.at })); } catch (e) {}
}
function ago(t) {
  const d = Math.floor((Date.now() - t) / DAY);
  return d <= 0 ? "today" : d === 1 ? "yesterday" : `${d} days ago`;
}
function when(v) { const t = v ? new Date(v).getTime() : NaN; return isFinite(t) ? t : null; }
function freshLine(extra) {
  const m = state.at ? Math.max(0, Math.round((Date.now() - state.at) / 60000)) : null;
  $("fresh").innerHTML = (extra ? `${esc(extra)} · ` : "") + (m == null ? "" : m === 0 ? "Updated just now" : `Updated ${m} min ago`) + ` <button type="button" class="btn sm" id="refresh">↻ Refresh</button>`;
  $("refresh").onclick = () => load();
}
setInterval(() => { if (state.at && $("refresh")) freshLine(); }, 60000);

// one learner, as the page reads it (old summaries without a state: seen in 1 exercise = once, in 2+ = still)
function learnerView(l) {
  const s = l.summary || null, ex = s && Array.isArray(s.ex) ? s.ex : [];
  const ms = s && Array.isArray(s.mistakes) ? s.mistakes.map(m => ({ m: String(m.m), words: String(m.words || m.m), ex: [].concat(m.ex || []).map(String),
    last: String(m.last || [].concat(m.ex || []).slice(-1)[0] || ""), since: String(m.since || ""),
    // (5 Nov) "correct later" needs 2 right in a row; a summary saved before (one was enough) with one right is read
    // as "correct 1 of 2" in its old column (seen once / repeated)
    rights: (r => r.length ? r : m.state === "fixed" && m.since ? [String(m.since)] : [])([].concat(m.rights || []).map(String)),
    state: (st => st === "fixed" && !(Array.isArray(m.rights) && m.rights.length >= 2) ? ([].concat(m.ex || []).length >= 2 ? "still" : "once") : st)
      (["still", "fixed", "once"].includes(m.state) ? m.state : [].concat(m.ex || []).length >= 2 ? "still" : "once"),
    asked: m.a != null ? !!Number(m.a) : [].concat(m.ex || []).length >= 2 || [].concat(m.rights || []).length >= 1,   // (5 Nov night) old summaries: seen again or correct since
    occ: [].concat(m.occ || []).map(o => ({ ex: String(o.ex), line: Number(o.line) || null, typed: String(o.typed || ""), right: String(o.right || "") })) })) : [];
  const last = when(l.updated), done = s ? Number(s.done) || 0 : 0;
  // (3 Nov, Ngoc) two reasons only, each with its exercises: the same mistake again (a misconception "repeated"), and
  // an exercise still wrong at the end after the answer (✗), until a later line of the same kind is right at once (rule c).
  // Not started and inactive are not reasons.  Old summaries without "wrong": every ✗ exercise counts.
  const again = [...new Set(ms.filter(m => m.state === "still").flatMap(m => m.ex))];
  const wrongs = s && Array.isArray(s.wrong) ? s.wrong.filter(w => !w.since).map(w => String(w.ex)) : ex.filter(x => x.k === "bad").map(x => String(x.n));
  const why = [];
  if (again.length) why.push("again");
  if (wrongs.length) why.push("answer");
  const other = s && Array.isArray(s.other) ? s.other.map(o => ({ ex: String(o.ex), line: Number(o.line) || null, typed: String(o.typed || ""), right: String(o.right || ""), why: oldStatus(String(o.why || "")) ? "" : WHY_NOW[String(o.why || "")] || String(o.why || ""), slip: !!o.slip })) : [];
  const progs = {}; if (s && s.progs && typeof s.progs === "object") Object.keys(s.progs).slice(0, 60).forEach(k => { if (typeof s.progs[k] === "string") progs[String(k)] = s.progs[k].slice(0, 3000); });
  // (5 Nov night) each wrong line with help (next_track.js lineTrack); a summary saved before has none: null
  const lines = s && Array.isArray(s.lines) ? s.lines.slice(0, 200).map(x => ({ h: String(x.h), f: Number(x.f) || 0, k: x.k == null ? null : Number(x.k) || 0, t: String(x.t) })) : null;
  return { l, s, ex, ms, other, progs, lines, last, done, total: s ? Number(s.total) || 8 : 8, why, again, wrongs, created: when(l.created) };
}
const WHY = { again: v => `Same mistake again (ex ${v.again.join(", ")})`, answer: v => `Wrong after being given the answer (ex ${v.wrongs.join(", ")})` };
// (3 Nov, Ngoc: D) (5 Nov) one right after the mistake: "seen once: ex 3 · correct 1 of 2: ex 4"
const STATE = m => m.state === "fixed" ? `fixed: correct in ex ${(m.rights.length ? m.rights : [m.since]).join(", ")}`
  : (m.state === "still" ? `repeated: ex ${m.ex.join(", ")}` : `seen once: ex ${m.last}`) + (m.rights.length === 1 ? ` · correct once (ex ${m.rights[0]}), 1 more needed` : "");

// (3 Nov, Ngoc: B, the Dashboard button stays for everyone) not a teacher: what the page is and how to get one
function forTeachers(guest) {
  if (!document.getElementById("ftcss")) document.head.insertAdjacentHTML("beforeend", `<style id="ftcss">.ft a.btn { text-decoration: none; }</style>`);
  return `<div class="card ft"><h2>The Dashboard is for teachers</h2><p>A teacher makes a class, gives its code to the learners, and sees here how each learner is doing.</p>`
    + `<p><a class="btn main" href="signin.html?tab=signup&teacher=1&next=dashboard.html${guest ? "" : "&switch=1"}">Sign up as a teacher</a>${guest ? ` <a class="btn" href="signin.html?next=dashboard.html">Log in</a>` : ""}</p>`
    + `${guest ? "" : `<p class="small muted">You are logged in as a learner: a teacher account is a new account.</p>`}</div>`;
}
function draw() {
  const r = state.data, teacher = r.role === "teacher";
  if (state.names === "auto") state.names = teacher;
  $("testmode").hidden = !r.testMode && !r.admin;
  $("testmode").textContent = r.testMode ? "Test mode: everyone can see everyone." : "Admin: you see every class.";   // (4 Nov) ADMINS in the script
  freshLine();
  // the class picker and New class, in the head
  const opts = (r.testMode || r.admin ? [`<option value="">Everyone</option>`] : []).concat(r.classes.map(c => `<option value="${esc(c.code)}"${state.cls === c.code ? " selected" : ""}>Class ${esc(c.code)}${c.own === false ? ` · ${esc(c.teacher)}` : ""}</option>`));
  $("pick").innerHTML = opts.length ? `<select id="clssel" aria-label="Class">${opts.join("")}</select>` : "";
  $("newbtn").innerHTML = teacher ? `<button class="btn main" type="button" id="newcls">+ New class</button>` : "";
  const V = r.learners.map(learnerView).sort((a, b) => (b.why.length - a.why.length) || (!a.done - !b.done) || a.l.name.localeCompare(b.l.name, "vi"));
  const nameOf = (v, i) => state.names ? esc(v.l.name) : `Learner ${i + 1}`;
  V.forEach((v, i) => { v.label = nameOf(v, i); });
  let html = "";
  const m = state.msg;
  if (m) html += m.ok ? `<p class="okmsg" role="status">✓ Class <b class="code">${esc(m.code)}</b> is ready. Give this code to your learners.</p>` : `<p class="badmsg" role="alert">✗ ${esc(m.text)}</p>`;
  const cls = r.classes.find(c => c.code === state.cls) || (!r.testMode && !r.admin && r.classes[0]) || null;
  if (teacher && !r.classes.length && state.tab === "overview") html += `<div class="card"><h2>No class yet</h2><p class="muted">Make one with <b>+ New class</b>: a code is made for you, give it to the learners.</p></div>`;
  if (cls && state.tab === "overview") html += classBar(cls, V.length);          // (3 Nov) the class bar on Overview only
  else if (!teacher && !r.testMode && !r.admin) html += `<div class="card"><p>This page is for teachers. Your own progress is in <b>My progress</b> (account menu).</p></div>`;
  document.querySelectorAll("#dtabs a").forEach(a => a.setAttribute("aria-current", a.dataset.tab === state.tab ? "page" : "false"));
  if (V.length || cls || r.testMode || r.admin) html += state.tab === "learners" ? learnersHtml(V, r) : state.tab === "mistakes" ? mistakesTable(V) : state.tab === "app" ? appHtml(V)
    : lookHtml(V) + `<div class="two">${hardHtml(V)}${topicsHtml(V)}</div>` + byExHtml(V);
  $("main").innerHTML = html;
  wire();
}
function classBar(c, n) {
  return `<div class="card classbar"><span class="big">${esc(c.code)}</span><button type="button" class="btn sm" id="copy" data-code="${esc(c.code)}">Copy</button>`
    + `<span class="small muted">Learners type it when they sign up, or account menu → Join a class · <b style="color:var(--ink)">${n} learner${n === 1 ? "" : "s"}</b></span>`
    + (c.own === false ? `<span class="small muted">Teacher: ${esc(c.teacher)}</span>` : `<button type="button" class="sw" role="switch" aria-checked="${!!c.open}" data-open="${esc(c.code)}" data-to="${c.open ? "0" : "1"}"><span class="t"></span>${c.open ? "New learners can join" : "Closed to new learners"}</button>`) + `</div>`;
}
// (3 Nov, Ngoc: "overview trông k được rõ ràng") four numbers first, one per question the page answers
function tilesHtml(V) {
  const started = V.filter(v => v.done).length, need = V.filter(v => v.why.length).length;
  // (5 Nov) a mistake right once since ("correct 1 of 2") is not one to explain again: the learner is getting it right
  const by = {}; V.forEach(v => v.ms.forEach(m => { const x = by[m.m] = by[m.m] || { open: 0, fixed: 0 }; m.state === "fixed" ? x.fixed++ : m.rights.length !== 1 ? x.open++ : 0; }));
  const open = Object.values(by).filter(x => x.open).length, fixed = Object.values(by).reduce((a, x) => a + x.fixed, 0);
  const t = (l, v, s, cls, href) => `<a class="tile${cls ? " " + cls : ""}"${href ? ` href="${href}"` : ""}><span class="l">${l}</span><span class="v">${v}</span></a>`;   // (3 Nov, Ngoc: "để số thôi, đừng có để chữ phụ") no small line under the number
  return `<div class="tiles">`
    + t("Learners", V.length, `${started} started`, "", "#learners")
    + t("Need a look", need, need ? "same mistake again, or wrong after being given the answer" : "nobody right now", need ? "bad" : "ok", "")
    + t("Mistakes to explain again", open, open ? "repeated or seen once" : "none open", open ? "warn" : "ok", "#mistakes")
    + `</div>`;   // (3 Nov, Ngoc: "bỏ") no "Right since" tile: no action for the teacher; it is in the Mistakes tab
}
// 1. which learner needs me? one line each: the name, the reason(s) with the exercises, Details → (3 Nov, Ngoc: was "Log →") (the details are in the Log)
function lookHtml(V) {
  const need = V.filter(v => v.why.length);
  if (!need.length) return `<div class="card look" style="border-left-color:var(--ok)"><h2>Needs a look</h2><p class="allgood">✓ Nobody needs a look right now.</p></div>`;

  const rows = Object.values(by).sort((a, b) => b.n - a.n || a.words.localeCompare(b.words)).map(x => { const a = x.fixed + x.once + x.still, w = k => (100 * k / a).toFixed(1) + "%";
    return `<tr><td>${esc(x.words.split(" or ").map(w => /^gets /.test(w) ? w : "thinks " + w).join(" or "))}</td><td>${x.n}</td><td>${x.fixed}</td><td>${x.once}</td><td>${x.still}</td><td class="muted">${x.no}</td><td class="mb">${a ? `<div class="bar sm">${[[x.fixed, C.ok], [x.once, C.warn], [x.still, C.bad]].filter(p => p[0]).map(p => `<i style="width:${w(p[0])};background:${p[1]}"></i>`).join("")}</div>` : ""}</td></tr>`; }).join("");
  const table = rows ? `<h3 class="sub">By misconception</h3><div class="evw"><table class="evt"><thead><tr><th>Misconception</th><th>Learners</th><th>Fixed</th><th>Correct once</th><th>Still learning</th><th>Not asked yet</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>` : "";
  const c1 = evCard(1, "Does the fix stay?", [["fixed: correct 2 times in a row", cnt(asked, m => stOf(m) === "fixed"), C.ok, 1], ["correct once, 1 more needed", cnt(asked, m => stOf(m) === "once"), C.warn], ["still learning", cnt(asked, m => stOf(m) === "still"), C.bad]],
    N => `learner–misconception pairs asked again after the help (card 2)`, `Later exercises and reviews with the same kind of line, no help. Not asked again yet: ${notAsked} (not in the %).`, true, table);
  const helped = lines.filter(x => x.h !== "none");
  const c2 = evCard(2, `Does the help fix the line? <span class="muted" style="font-weight:500">(in the same exercise)</span>`, [["correct on the second try", cnt(helped, x => x.h === "retry"), C.ok, 1], ["correct after Step back", cnt(helped, x => x.h === "step"), C.ok, 1], ["correct after the Hint", cnt(helped, x => x.h === "hint"), C.help, 1], ["correct after seeing the answer", cnt(helped, x => x.h === "answer"), C.warn], ["still wrong", cnt(helped, x => x.h === "wrong"), C.bad]],
    N => `wrong line${N === 1 ? "" : "s"} with help`, `How far the help had to go, right after the mistake. {big} = Step back or the Hint, before the answer.${old}`);
  const c3 = evCard(3, "Is it the same idea again?", [["seen again in another exercise", cnt(pairs, m => new Set(m.ex).size >= 2), C.acc, 1], ["seen once", cnt(pairs, m => new Set(m.ex).size < 2), C.line]],
    N => `learner–misconception pairs`, "A misconception is a steady wrong idea, not a slip: does the same one come back in another exercise?");
  const c4 = evCard(4, "Do the misconceptions explain the mistakes?", [["a misconception fits", cnt(lines, x => x.t === "m"), C.acc, 1], ["another mistake (a slip, another order …)", cnt(lines, x => x.t === "o"), C.mut], ["unexplained", cnt(lines, x => x.t === "u"), C.bad]],
    N => `wrong line${N === 1 ? "" : "s"}`, `The first answer of each wrong line. “Fits”: the misconception gives exactly the answer typed (it may fit by chance).${old}`);
  const two = helped.filter(x => x.f >= 2 && x.k != null);
  const c5 = evCard(5, "Does the help tell misconceptions apart?", [["narrowed to one", cnt(two, x => x.k === 1), C.ok, 1], ["still 2 or more", cnt(two, x => x.k >= 2), C.warn], ["all ruled out", cnt(two, x => x.k === 0), C.mut]],
    N => `answer${N === 1 ? "" : "s"} that fitted 2 or more`, `Narrowed, not proven: a misconception is ruled out when the learner is correct at a Step back where it gives another answer. Fewer than 5 answers: only the counts, no %.${old}`, false, "", true);
  return `<div class="ev"><p class="small muted evnote">For the research: how well the help works. You do not need this page to teach.</p>${c1}${c2}${c3}${c4}${c5}</div>`;   // (5 Nov, Ngoc: "ok thêm đi") one line on what this tab is for
}
// Topics (3 Nov, Ngoc: one bar = the whole class; B: "practising" in amber as in My progress, not "wrong"; a part that is 0 is not written): each learner
// (3 Nov, Ngoc: "để màu giải thích, ở dưới ghi số thôi") a key of the colours on top, only numbers by each bar
// is good (every criterion met so far is good), still learning (5 Nov: the word of My progress; before "practising") (a criterion met so far not good yet: wrong in an exercise, and not the last 2 exercises with it right) or not seen yet (no criterion of the topic met, or no exercise yet)
function topicsHtml(V) {
  if (!V.length) return `<div class="card"><h2>Topics</h2><p class="empty">No learners yet.</p></div>`;
  const first = V.find(v => v.s && Array.isArray(v.s.topics));
  if (!first) return `<div class="card"><h2>Topics</h2><p class="empty">No exercise finished yet.</p></div>`;
  const rows = first.s.topics.map((t, gi) => {
    let good = 0, prac = 0;
    V.forEach(v => {
      const x = v.s && Array.isArray(v.s.topics) ? v.s.topics[gi] : null;
      const met = x && Array.isArray(x.crit) ? x.crit.filter(c => c.s !== 2) : [];
      if (!met.length) return;
      if (met.every(c => c.s === 0)) good++; else prac++;
    });
    const n = V.length, ns = n - good - prac, w = k => (100 * k / n) + "%";
    return `<div class="bar"><div class="r"><span>${esc(t.g)}</span><span class="tc">${[good ? `<b class="g">${good}</b>` : "", prac ? `<b class="p">${prac}</b>` : "", ns ? `<span class="muted">${ns}</span>` : ""].filter(Boolean).join(" · ")}</span></div>`
      + `<div class="track"><i class="g" style="width:${w(good)}"></i><i class="p" style="width:${w(prac)}"></i></div></div>`;
  }).join("");
  return `<div class="card"><h2>Topics</h2><span class="small muted">Learners in the class, by topic</span><div class="legend"><span><i style="background:var(--ok)"></i>good</span><span><i style="background:var(--warn)"></i>still learning</span><span><i style="background:var(--line)"></i>not seen yet</span></div>${rows}</div>`;
}

function wire() {
  const sel = $("clssel"); if (sel) sel.onchange = () => { state.cls = sel.value; state.data = null; state.filter = ""; try { localStorage.setItem("dash-cls", state.cls); } catch (e) {} load(); };
  const nm = $("shownames"); if (nm) nm.onchange = () => { state.names = nm.checked; try { localStorage.setItem("dash-names", nm.checked ? "1" : "0"); } catch (e) {} draw(); };
  const cp = $("copy"); if (cp) cp.onclick = async () => { try { await navigator.clipboard.writeText(cp.dataset.code); cp.textContent = "Copied ✓"; } catch (e) { cp.textContent = "Select and copy"; } setTimeout(() => { cp.textContent = "Copy"; }, 1600); };
  const uf = $("unfilter"), fb = $("fromback"); if (uf) uf.onclick = () => { const f = state.from; state.filter = ""; state.from = null;
    if (f && f.tab !== state.tab) { state.back = f.key; location.hash = f.tab; } else draw(); };
  if (fb && uf) fb.onclick = uf.onclick;
  document.querySelectorAll("[data-filter]").forEach(b => b.onclick = ev => { ev.preventDefault(); state.filter = state.filter === b.dataset.filter ? "" : b.dataset.filter;
    if (state.filter) { state.from = { tab: state.tab, key: b.dataset.filter }; location.hash = "learners"; state.tab = "learners"; } draw(); window.scrollTo({ top: 0 }); });
  // (2 Nov, Ngoc) one click, the code is made by the script; the button says it is working, then a green line
  const f = $("newcls"); if (f) f.onclick = async () => {
    if (state.creating) return;
    state.creating = true; f.disabled = true; f.textContent = "Creating…";
    let r; try { r = await api("createClass", {}); } catch (e) { r = { error: "net" }; }
    state.creating = false;
    if (r.ok) { state.msg = { ok: true, code: r.code }; state.cls = r.code; state.data = null; try { localStorage.setItem("dash-cls", r.code); } catch (e) {} load(); }
    else { state.msg = { ok: false, text: r.error === "net" ? "Could not reach the server (internet?). Try again." : r.error === "teacher" ? "Only a teacher account can create a class." : "The class was not created. Try again." }; draw(); }
  };
  document.querySelectorAll("[data-open]").forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { await api("openClass", { code: b.dataset.open, open: b.dataset.to === "1" }); } catch (e) {}
    load(); });
  document.querySelectorAll("[data-reset]").forEach(b => b.onclick = async () => {
    const out = document.querySelector(`[data-out="${b.dataset.reset}"]`);
    if (!b.dataset.sure) { b.dataset.sure = "1"; b.textContent = "Click again: new recovery code"; return; }
    const r = await api("resetLearner", { username: b.dataset.reset });
    out.innerHTML = r.ok ? `New recovery code: <span class="code-box">${esc(r.recovery)}</span> — give it to the learner (Log in → Forgot password).` : "Not allowed.";
    b.textContent = "Reset password"; delete b.dataset.sure; const d = b.closest("details"); if (d) d.open = false; });
  document.querySelectorAll("[data-remove]").forEach(b => b.onclick = async () => {
    if (!b.dataset.sure) { b.dataset.sure = "1"; b.textContent = "Click again: remove"; return; }
    const r = await api("removeLearner", { username: b.dataset.remove }); if (r.ok) load(); });
}
load();
</script>
